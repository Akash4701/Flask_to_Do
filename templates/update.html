{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% endblock head %}

{% block body %}
<div class="container">
  <h1>Update Todo</h1>
  <form class="update-form" action="/update/{{todo.sno}}" method="POST">
    <div class="form-group">
      <label for="title" class="form-label">Title</label>
      <input
        type="text"
        name="title"
        value="{{todo.title}}"
        class="form-control"
        id="title"
        required
      />
    </div>
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <input
        type="text"
        name="desc"
        value="{{todo.desc}}"
        class="form-control"
        id="description"
      />
    </div>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="completed" name="completed" {% if todo.completed %}checked{% endif %} />
      <label class="form-check-label" for="completed">Mark as completed</label>
    </div>
    <button type="submit" class="btn btn-primary">Update Todo</button>
  </form>
</div>
{% endblock body %}
